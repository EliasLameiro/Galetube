spring.application.name=galetube

# Cargar el .env
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.hibernate.SQL=debug

galetube.jwt.secret=${JWT_SECRET}
galetube.jwt.expiration=1h

spring.web.error.include-stacktrace=never

logging.file.name=logs/galetube.log

# Configuración del almacenamiento S3 
galetube.storage.endpoint=http://localhost:${S3_PORT:8333}
galetube.storage.region=us-east-1
galetube.storage.access-key=${S3_ACCESS_KEY}
galetube.storage.secret-key=${S3_SECRET_KEY}
galetube.storage.bucket=${S3_BUCKET}
galetube.storage.path-style-access=true
galetube.storage.upload-url-expiration=15m
galetube.video.allowed-content-types=video/mp4,video/webm,video/quicktime
galetube.video.max-upload-size=2GB
galetube.storage.download-url-expiration=10m